<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6D9C8"/><stop offset=".5" stop-color="#E5D2BD"/><stop offset="1" stop-color="#93ACCF"/></linearGradient>
    <radialGradient id="glow" cx="70%" cy="20%" r="50%"><stop offset="0" stop-color="#F2A07E" stop-opacity=".55"/><stop offset="1" stop-color="#F2A07E" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="10%" cy="85%" r="45%"><stop offset="0" stop-color="#6CC3BA" stop-opacity=".45"/><stop offset="1" stop-color="#6CC3BA" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#261F1C" flood-opacity=".28"/></filter>
    <filter id="sh2" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#261F1C" flood-opacity=".18"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#261F1C" fill-opacity=".09"/></pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/><rect width="800" height="1000" fill="url(#glow2)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>

  <!-- dashed flight path + paper plane -->
  <path d="M90 300 C 200 120, 420 160, 560 110" fill="none" stroke="#261F1C" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <g transform="translate(560 82) rotate(-12)" filter="url(#sh2)">
    <path d="M0 30 L78 0 L50 66 L36 44 Z" fill="#F6F3EE"/>
    <path d="M36 44 L78 0 L28 36 Z" fill="#E5D2BD"/>
  </g>

  <!-- phone -->
  <g transform="translate(205 230)" filter="url(#sh)">
    <rect width="390" height="700" rx="56" fill="#261F1C"/>
    <rect x="14" y="14" width="362" height="672" rx="44" fill="#F6F3EE"/>
    <rect x="150" y="30" width="90" height="10" rx="5" fill="#261F1C" fill-opacity=".85"/>
    <!-- header -->
    <g transform="translate(40 80)">
      <image width="52" height="52" href="data:image/png;base64,"/>
      <rect x="68" y="8" width="140" height="14" rx="7" fill="#261F1C" fill-opacity=".8"/>
      <circle cx="74" cy="38" r="5" fill="#25D366"/><rect x="86" y="33" width="84" height="10" rx="5" fill="#261F1C" fill-opacity=".3"/>
    </g>
    <line x1="40" y1="160" x2="350" y2="160" stroke="#261F1C" stroke-opacity=".08" stroke-width="2"/>
    <!-- incoming -->
    <g transform="translate(40 190)">
      <rect width="230" height="76" rx="22" fill="#FFFFFF"/>
      <rect x="22" y="22" width="170" height="11" rx="5.5" fill="#261F1C" fill-opacity=".55"/>
      <rect x="22" y="44" width="120" height="11" rx="5.5" fill="#261F1C" fill-opacity=".3"/>
    </g>
    <!-- outgoing -->
    <g transform="translate(110 290)">
      <rect width="240" height="98" rx="22" fill="#2B4FAF"/>
      <rect x="22" y="22" width="190" height="11" rx="5.5" fill="#F6F3EE" fill-opacity=".9"/>
      <rect x="22" y="44" width="150" height="11" rx="5.5" fill="#F6F3EE" fill-opacity=".65"/>
      <rect x="22" y="66" width="90" height="11" rx="5.5" fill="#F6F3EE" fill-opacity=".45"/>
    </g>
    <!-- incoming with heart -->
    <g transform="translate(40 412)">
      <rect width="190" height="58" rx="22" fill="#FFFFFF"/>
      <rect x="22" y="23" width="110" height="11" rx="5.5" fill="#261F1C" fill-opacity=".45"/>
      <circle cx="190" cy="56" r="17" fill="#F2A07E"/>
      <path d="M190 64 l-8-8 a5 5 0 0 1 8-6 a5 5 0 0 1 8 6z" fill="#FFFFFF"/>
    </g>
    <!-- typing -->
    <g transform="translate(40 500)">
      <rect width="96" height="46" rx="23" fill="#FFFFFF"/>
      <circle cx="30" cy="23" r="6" fill="#261F1C" fill-opacity=".45"/><circle cx="48" cy="23" r="6" fill="#261F1C" fill-opacity=".3"/><circle cx="66" cy="23" r="6" fill="#261F1C" fill-opacity=".18"/>
    </g>
    <!-- composer -->
    <g transform="translate(32 600)">
      <rect width="326" height="58" rx="29" fill="#FFFFFF" stroke="#261F1C" stroke-opacity=".1" stroke-width="2"/>
      <rect x="24" y="24" width="150" height="10" rx="5" fill="#261F1C" fill-opacity=".22"/>
      <circle cx="298" cy="29" r="21" fill="#261F1C"/>
      <path d="M289 29 h14 m-6 -7 l7 7 -7 7" stroke="#F6F3EE" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- floating envelope -->
  <g transform="translate(90 600) rotate(-10)" filter="url(#sh2)">
    <rect width="150" height="104" rx="14" fill="#F6F3EE"/>
    <path d="M6 10 L75 60 L144 10" fill="none" stroke="#2B4FAF" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- floating badge -->
  <g transform="translate(560 560) rotate(8)" filter="url(#sh2)">
    <rect width="150" height="64" rx="32" fill="#261F1C"/>
    <circle cx="34" cy="32" r="9" fill="#25D366"/>
    <rect x="54" y="26" width="72" height="12" rx="6" fill="#F6F3EE" fill-opacity=".85"/>
  </g>
</svg>
